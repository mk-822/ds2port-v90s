[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ds2port-v90s"
version = "0.1.3"
description = "Transfer owned Compile DiscStation games to PlumOS V90S V2"
requires-python = ">=3.11"
dependencies = ["paramiko==3.5.1"]

[project.gui-scripts]
ds2port-v90s = "ds2port.gui:main"

[project.scripts]
ds2port = "ds2port.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
